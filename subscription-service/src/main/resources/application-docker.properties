spring.application.name=subscription-service
server.port=8181

spring.datasource.url=jdbc:postgresql://subscription-service-db:5432/subscription_db
spring.datasource.username=user
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

# jpa
spring.jpa.properties.hibernate.default_schema=v1_subscription_service
spring.jpa.hibernate.ddl-auto=validate

spring.flyway.schemas=v1_subscription_service
spring.flyway.create-schemas=true

jwt.secret=eGlkoAI8ndZwcb2zVHOo997+Zy8/0S3XtfAb87HlLgjX8LxfHp/tz2ymRIh2+TjcbofV5zNo47HML8BvxQ7HZg==

# AWS configuration
app.aws.sns.subscription-topic-arn=arn:aws:sns:eu-central-1:000000000000:subscription-produce-topic
app.aws.sqs.subscription-consume-queue=subscription-consume-queue

app.allowedorigins=${ALLOWED_ORIGINS:http:localhost}

spring.cloud.aws.region.static=eu-central-1
spring.cloud.aws.endpoint=http://localstack:4566
spring.cloud.aws.credentials.access-key=${AWS_ACCESS_KEY_ID:test}
spring.cloud.aws.credentials.secret-key=${AWS_SECRET_ACCESS_KEY:test}

# logging
logging.level.root=INFO
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.com.dmytrocherkes.subscriptionservice=TRACE

# actuator
management.endpoint.health.show-details=always
