server {
    listen 80;
    server_name localhost;

    # Gzip compression for faster loading
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Security headers against XSS and Clickjacking
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";

    location / {
        root /usr/share/nginx/html;
        index index.html;
        # Required for Single Page Applications (SPA)
        try_files $uri $uri/ /index.html;
    }

    # Proxy to IAM Service
    location /api/v1/iam-service {
        proxy_pass http://iam-service:8180;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Proxy to Cities API
    location /api/v1/cities {
        proxy_pass http://subscription-service:8181;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Proxy to Subscription Service
    location /api/v1/subscriptions {
        proxy_pass http://subscription-service:8181;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Static assets caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        root /usr/share/nginx/html;
        expires 1d;
        add_header Cache-Control "public, no-transform";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
