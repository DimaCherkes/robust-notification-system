name: decision-microservice-isolated

# docker-compose for starting only decision microservice
services:
  decision-service-db-isolated:
    image: postgres:15-alpine
    container_name: decision-service-db-isolated
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: decision_db
    volumes:
      - decision-service-db-data:/var/lib/postgresql/data
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d weather_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - decision-service-isolated-network

  decision-service-isolated:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: decision-service-isolated
    depends_on:
      weather-service-db-isolated:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://decision-service-db-isolated:5432/decision_db
      SPRING_DATASOURCE_USERNAME: user
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    ports:
      - "8183:8183"
    networks:
      - decision-service-isolated-network

volumes:
  decision-service-db-data:
    name: decision-service-db-data

networks:
  decision-service-isolated-network:
    driver: bridge
