spring.application.name=decision-service
server.port=8183

spring.datasource.url=jdbc:postgresql://decision-service-db:5432/decision_db
spring.datasource.username=user
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

# jpa
spring.jpa.properties.hibernate.default_schema=v1_decision_service
spring.jpa.hibernate.ddl-auto=validate

spring.flyway.schemas=v1_decision_service
spring.flyway.create-schemas=true

# App Config
# produce queue
app.aws.sqs.notification-queue=notification-queue

app.aws.sqs.decision-consume-queue=decision-consume-queue
app.aws.sqs.subscription-queue=subscription-consume-queue

# AWS / SQS Config
spring.cloud.aws.sqs.listener.poll-timeout=20s
spring.cloud.aws.region.static=eu-central-1
spring.cloud.aws.endpoint=${AWS_ENDPOINT:http://localstack:4566}
spring.cloud.aws.credentials.access-key=${AWS_ACCESS_KEY:test}
spring.cloud.aws.credentials.secret-key=${AWS_SECRET_KEY:test}

# logging
logging.level.root=INFO
logging.level.com.dmitrycherkes.weatherservice=DEBUG
