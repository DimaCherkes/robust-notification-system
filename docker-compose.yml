# docker-compose for starting whole application
services:
  iam-service-db:
    image: postgres:15-alpine
    container_name: iam-service-db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: iam_db
    volumes:
      - iam-service-db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U user -d iam_db" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - robust-notification-system-network

  iam-service:
    build:
      context: ./iam-service
      dockerfile: docker/Dockerfile
    container_name: iam-service
    depends_on:
      iam-service-db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://iam-service-db:5432/iam_db
      SPRING_DATASOURCE_USERNAME: user
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    ports:
      - "8180:8180"
    networks:
      - robust-notification-system-network


  # subscription service
  subscription-service-db:
    image: postgres:15-alpine
    container_name: subscription-service-db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: subscription_db
    volumes:
      - subscription-service-db-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U user -d subscription_db" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - robust-notification-system-network

  subscription-service:
    build:
      context: ./subscription-service
      dockerfile: docker/Dockerfile
    container_name: subscription-service
    depends_on:
      subscription-service-db:
        condition: service_healthy
      localstack:
        condition: service_healthy
    environment:
      PROFILE: ${PROFILE:-docker}
      SPRING_DATASOURCE_URL: jdbc:postgresql://subscription-service-db:5432/subscription_db
      SPRING_DATASOURCE_USERNAME: user
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      AWS_ENDPOINT: http://localstack:4566
    ports:
      - "8181:8181"
    networks:
      - robust-notification-system-network

  # weather service
  weather-service-db:
    image: postgres:15-alpine
    container_name: weather-service-db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: weather_db
    volumes:
      - weather-service-db-data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U user -d weather_db" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - robust-notification-system-network

  weather-service:
    build:
      context: ./weather-service
      dockerfile: docker/Dockerfile
    container_name: weather-service
    depends_on:
      weather-service-db:
        condition: service_healthy
      localstack:
        condition: service_healthy
    environment:
      PROFILE: ${PROFILE:-docker}
      SPRING_DATASOURCE_URL: jdbc:postgresql://weather-service-db:5432/weather_db
      SPRING_DATASOURCE_USERNAME: user
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      AWS_ENDPOINT: http://localstack:4566
      WEATHER_API_KEY: ${WEATHER_API_KEY:-dummy_key}
    ports:
      - "8182:8182"
    networks:
      - robust-notification-system-network

  # decision service
  decision-service-db:
    image: postgres:15-alpine
    container_name: decision-service-db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: decision_db
    volumes:
      - decision-service-db-data:/var/lib/postgresql/data
    ports:
      - "5435:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U user -d decision_db" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - robust-notification-system-network

  decision-service:
    build:
      context: ./decision-service
      dockerfile: docker/Dockerfile
    container_name: decision-service
    depends_on:
      decision-service-db:
        condition: service_healthy
      localstack:
        condition: service_healthy
    environment:
      PROFILE: ${PROFILE:-docker}
      SPRING_DATASOURCE_URL: jdbc:postgresql://decision-service-db:5432/decision_db
      SPRING_DATASOURCE_USERNAME: user
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      AWS_ENDPOINT: http://localstack:4566
      WEATHER_API_KEY: ${WEATHER_API_KEY:-dummy_key}
    ports:
      - "8183:8183"
    networks:
      - robust-notification-system-network

  # AWS infra
  localstack:
    image: localstack/localstack:4.13.0
    container_name: aws-infra
    ports:
      - "4566:4566"
    entrypoint: >
      /bin/bash -c "
       chmod +x /etc/localstack/init/ready.d/localstack-init.sh &&
       /usr/local/bin/docker-entrypoint.sh
       "
    environment:
      - SERVICES=sqs,sns
      - DEBUG=1
      - DOCKER_HOST=unix:///var/run/docker.sock
#      - LOCALSTACK_AUTH_TOKEN=${LOCALSTACK_AUTH_TOKEN:-test}
    volumes:
      - ./localstack-init.sh:/etc/localstack/init/ready.d/localstack-init.sh
      - "/var/run/docker.sock:/var/run/docker.sock"
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:4566/_localstack/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - robust-notification-system-network

  # Frontend web app
  frontend:
    build:
      context: ./frontend
      dockerfile: docker/Dockerfile
    container_name: frontend-app
    depends_on:
      iam-service:
        condition: service_healthy
      subscription-service:
        condition: service_healthy
    ports:
      - "80:80"
    networks:
      - robust-notification-system-network

volumes:
  iam-service-db-data:
    name: iam-service-db-data
  subscription-service-db-data:
    name: subscription-service-db-data
  weather-service-db-data:
    name: weather-service-db-data
  decision-service-db-data:
    name: decision-service-db-data

networks:
  robust-notification-system-network:
    driver: bridge
